<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Halowatt Servis — Mijozlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--teal:#01825F;--teal2:#016B4E;--ink:#0F2A22;--muted:#5E7A70;--line:#E2ECE8;--bg:#F3F7F5;--card:#fff;--ice:#E6F4EF;--red:#C0392B;--orange:#C77700}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:28px}
  header{background:var(--teal);color:#fff;padding:14px 16px 16px}
  header .t{font-weight:800;font-size:19px} header .s{font-size:13px;opacity:.85;margin-top:2px}
  .sayt{display:block;margin:12px 12px 0;padding:11px 14px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--line) inset;color:var(--teal);font-weight:800;font-size:14px;border:0;width:calc(100% - 24px);text-align:left;font-family:inherit}
  .sayt span{font-weight:600;color:var(--muted);font-size:12px;display:block}
  main{padding:4px 12px}
  h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
  .card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 10px;box-shadow:0 1px 0 var(--line)}
  .hello{background:linear-gradient(135deg,#E6F7F0,#C8ECDF)} .hello b{font-size:18px;display:block}
  .muted{color:var(--muted)} .small{font-size:13px}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:800 16px Manrope,sans-serif;background:var(--teal);color:#fff;margin:10px 0 0}
  .btn.ghost{background:var(--ice);color:var(--teal)} .btn:disabled{opacity:.6}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{border:0;border-radius:16px;padding:16px 12px;background:#fff;box-shadow:0 1px 0 var(--line);text-align:left;font-family:inherit;color:var(--ink)}
  .tile .e{font-size:26px} .tile b{display:block;margin-top:8px;font-size:15px} .tile span{font-size:12px;color:var(--muted)}
  .tile.big{grid-column:1/3;background:var(--teal);color:#fff} .tile.big span{color:#d8f2e8}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:0;border-radius:999px;padding:10px 14px;background:#fff;box-shadow:0 0 0 1px var(--line) inset;font:600 14px Manrope,sans-serif;color:var(--ink)}
  .chip.on{background:var(--teal);color:#fff;box-shadow:none}
  label.f{display:block;font-weight:700;font-size:14px;margin:16px 4px 8px}
  .in{width:100%;border:0;border-radius:12px;padding:13px 14px;font:500 15px Manrope,sans-serif;background:#fff;box-shadow:0 0 0 1px var(--line) inset;color:var(--ink)}
  textarea.in{min-height:84px;resize:vertical}
  .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--ice);color:var(--teal)}
  .pill.wait{background:#FFF4E0;color:var(--orange)}
  .err{background:#FDECEA;color:var(--red);border-radius:14px;padding:12px 14px;margin:12px 0;font-weight:600}
  .spin{width:34px;height:34px;border:4px solid var(--ice);border-top-color:var(--teal);border-radius:50%;margin:40px auto;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .ok{text-align:center;padding:26px 10px} .ok .e{font-size:54px} .ok b{display:block;font-size:20px;margin:10px 0 6px}
  .back{border:0;background:none;color:var(--teal);font:700 14px Manrope,sans-serif;margin:14px 4px 0}
</style>
</head>
<body>
<header><div class="t">Halowatt Servis</div><div class="s" id="sub">Xavfsizlik tizimlari xizmati</div></header>
<button class="sayt" id="sayt">🌐 halowatt.uz — saytga o'tish<span>Katalog, narxlar va do'konlarimiz ›</span></button>
<main id="main"><div class="spin"></div></main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbytPwCL-MZPwtpr3swxDePb4oKkduTxQmbasS2ZC251Wr2sI0lDcvwIHyBYCd1LJEyeSg/exec';
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#01825F'); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const hap = t => { try { t === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.selectionChanged(); } catch (e) {} };
let S = null, F = {}, SAYT = 'https://halowatt.uz';
async function api(body) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : '' }, body)) });
  return r.json();
}
$('sayt').onclick = () => { hap(); try { tg.openLink(SAYT); } catch (e) { location.href = SAYT; } };
function xato(m) { $('main').innerHTML = '<div class="err">⚠️ ' + esc(m) + '</div><button class="btn ghost" onclick="yukla()">🔄 Qayta urinish</button>'; }
async function yukla() {
  $('main').innerHTML = '<div class="spin"></div>';
  if (!tg || !tg.initData) return xato('Ilovani Telegram\'dagi Halowatt botidan oching.');
  try { S = await api({ mapi: 'holat' }); if (S.sayt) SAYT = S.sayt; if (!S.ok) return xato(S.xato || 'Xatolik'); S.ruxsat ? bosh() : royxat(); }
  catch (e) { xato('Internet bilan muammo. Qayta urinib ko\'ring.'); }
}
/* 1 — ro'yxatdan o'tish */
function royxat(ismKerak) {
  $('sub').textContent = 'Xush kelibsiz!';
  $('main').innerHTML = '<div class="card hello" style="margin-top:12px"><b>Assalomu alaykum!</b><div class="small" style="margin-top:6px">Halowatt servis xizmatiga xush kelibsiz. Sizni tanishimiz uchun telefon raqamingizni yuboring — bir marta.</div></div>' +
    (ismKerak ? '<label class="f">Ismingiz</label><input class="in" id="ism" placeholder="Masalan: Aziz aka" maxlength="60" value="' + esc(S.ism || '') + '">' : '') +
    '<button class="btn" id="tel">📞 Raqamni yuborish</button><p class="muted small" style="margin:12px 4px">Raqamingiz faqat xizmat uchun ishlatiladi: usta chaqirish, ish holati va kafolat haqida xabarlar.</p>';
  $('tel').onclick = () => {
    hap();
    if (ismKerak && !$('ism').value.trim()) { $('ism').focus(); return; }
    if (!tg.requestContact) return xato('Telegram ilovangizni yangilang.');
    tg.requestContact(async (ok, res) => {
      if (!ok || !res || !res.response) return;
      $('tel').disabled = true; $('tel').textContent = 'Tekshirilmoqda…';
      try {
        const r = await api({ mapi: 'royxat', kontakt: res.response, ism: ismKerak ? $('ism').value.trim() : '' });
        if (!r.ok) return xato(r.xato);
        if (r.ismKerak) return royxat(true);
        S = r; hap('ok'); bosh();
      } catch (e) { xato('Internet bilan muammo. Qayta urinib ko\'ring.'); }
    });
  };
}
/* 2 — asosiy ekran */
function bosh() {
  const m = S.mijoz || {};
  $('sub').textContent = m.ism || 'Halowatt mijozi';
  const yil = S.birinchi ? S.birinchi.slice(0, 4) : '';
  let h = '<div class="card hello" style="margin-top:12px"><b>Assalomu alaykum, ' + esc(m.ism) + '!</b><div class="small" style="margin-top:6px">' +
    (S.tarix && S.ishlar && S.ishlar.length ? 'Siz bilan ' + yil + '-yildan beri ishlaymiz. Oxirgi xizmat: ' + esc(S.ishlar[0].sana) + '.' : 'Biror muammo bo\'lsa — bir tugma bilan usta chaqiring.') + '</div></div>';
  if (S.arizalar && S.arizalar.length) h += '<h2>Ko\'rib chiqilayotgan arizalar</h2>' + S.arizalar.map(a => '<div class="card"><div class="row"><b>№ ' + esc(a.n) + '</b><span class="pill' + (a.holat === 'Kutilmoqda' ? ' wait' : '') + '">' + (a.holat === 'Kutilmoqda' ? '⏳ Ko\'rib chiqilmoqda' : a.usta ? '👷 ' + esc(a.usta) : '✅ Qabul qilindi') + '</span></div><div class="small muted" style="margin-top:6px">🛠 ' + esc(a.muammo) + ' · ' + esc(a.vaqt) + '</div></div>').join('');
  h += '<div class="grid" style="margin-top:12px"><button class="tile big" id="t_usta"><div class="e">🛠</div><b>Usta chaqirish</b><span>Muammoni tanlang — 30 soniya</span></button>' +
    (S.tarix ? '<button class="tile" id="t_ish"><div class="e">📋</div><b>Mening ishlarim</b><span>' + (S.ishlar || []).length + ' ta xizmat</span></button>' +
    '<button class="tile" id="t_tiz"><div class="e">📷</div><b>Mening tizimim</b><span>Nima o\'rnatilgan</span></button>' : '') + '</div>' +
    '<button class="btn ghost" id="t_sav">💬 Savol berish</button>';
  $('main').innerHTML = h;
  $('t_usta').onclick = () => { hap(); F = {}; ariza(); };
  if ($('t_ish')) $('t_ish').onclick = () => { hap(); ishlar(); };
  if ($('t_tiz')) $('t_tiz').onclick = () => { hap(); tizim(); };
  $('t_sav').onclick = () => { hap(); try { tg.close(); } catch (e) {} };
}
const orqaga = () => '<button class="back" id="orq">‹ Orqaga</button>';
function orqUlash() { $('orq').onclick = () => { hap(); bosh(); window.scrollTo(0, 0); }; }
/* 3 — usta chaqirish */
function ariza() {
  const V = ['Bugun', 'Ertaga', 'Kelishamiz'];
  let h = orqaga() + '<h2>Usta chaqirish</h2><label class="f">Muammo nima?</label><div class="chips">' + (S.muammolar || []).map((x, i) => '<button class="chip' + (F.muammo === x ? ' on' : '') + '" data-m="' + i + '">' + esc(x) + '</button>').join('') + '</div>' +
    '<label class="f">Manzil</label><input class="in" id="manzil" maxlength="200" placeholder="Mahalla, ko\'cha, uy yoki mo\'ljal" value="' + esc(F.manzil || '') + '">' +
    '<button class="chip" id="lok" style="margin-top:8px">' + (F.lat ? '✅ Lokatsiya olindi' : '📍 Lokatsiyani yuborish') + '</button>' +
    '<label class="f">Qachon qulay?</label><div class="chips">' + V.map(x => '<button class="chip' + (F.qvaqt === x ? ' on' : '') + '" data-v="' + x + '">' + x + '</button>').join('') + '</div>' +
    '<label class="f">Izoh (ixtiyoriy)</label><textarea class="in" id="izoh" maxlength="500" placeholder="Masalan: 2 ta kamera tunda ko\'rsatmayapti">' + esc(F.izoh || '') + '</textarea>' +
    '<button class="btn" id="yub">✅ Yuborish</button><div id="xb"></div>';
  $('main').innerHTML = h; orqUlash();
  const saqla = () => { F.manzil = $('manzil').value; F.izoh = $('izoh').value; };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { hap(); saqla(); F.muammo = S.muammolar[+b.dataset.m]; ariza(); });
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { hap(); saqla(); F.qvaqt = b.dataset.v; ariza(); });
  $('lok').onclick = () => {
    hap(); saqla();
    if (!navigator.geolocation) return;
    $('lok').textContent = 'Aniqlanmoqda…';
    navigator.geolocation.getCurrentPosition(p => { F.lat = p.coords.latitude; F.lng = p.coords.longitude; ariza(); }, () => { $('lok').textContent = '⚠️ Lokatsiya olinmadi — manzilni yozing'; }, { enableHighAccuracy: true, timeout: 10000 });
  };
  $('yub').onclick = async () => {
    saqla();
    if (!F.muammo) return $('xb').innerHTML = '<div class="err">Muammoni tanlang.</div>';
    if (!F.manzil.trim() && !F.lat) return $('xb').innerHTML = '<div class="err">Manzilni yozing yoki lokatsiya yuboring.</div>';
    $('yub').disabled = true; $('yub').textContent = 'Yuborilmoqda…';
    try {
      const r = await api(Object.assign({ mapi: 'ariza' }, F));
      if (!r.ok) { $('yub').disabled = false; $('yub').textContent = '✅ Yuborish'; return $('xb').innerHTML = '<div class="err">' + esc(r.xato) + '</div>'; }
      hap('ok');
      $('main').innerHTML = '<div class="card ok" style="margin-top:12px"><div class="e">✅</div><b>Arizangiz qabul qilindi</b><div>№ ' + esc(r.n) + '</div><p class="muted small" style="margin-top:10px">' +
        (r.ishVaqti ? 'Xodimimiz tez orada qo\'ng\'iroq qiladi.' : 'Ertaga soat 09:00 da qo\'ng\'iroq qilamiz.') + ' Holat haqidagi xabarlar shu botga keladi.</p></div><button class="btn ghost" id="bb">Bosh sahifaga</button>';
      $('bb').onclick = () => yukla();
    } catch (e) { $('yub').disabled = false; $('yub').textContent = '✅ Yuborish'; $('xb').innerHTML = '<div class="err">Internet bilan muammo.</div>'; }
  };
}
/* 4 — mening ishlarim */
function ishlar() {
  const L = S.ishlar || [];
  $('main').innerHTML = orqaga() + '<h2>Mening ishlarim</h2>' + (L.length ? L.map(j => '<div class="card"><div class="row"><b>' + esc(j.turlar || 'Xizmat') + '</b><span class="pill' + (j.holat === 'ochiq' ? ' wait' : '') + '">' + (j.holat === 'ochiq' ? '⏳ Jarayonda' : j.holat === 'otkaz' ? 'Bekor' : '✅ Bajarildi') + '</span></div><div class="small muted" style="margin-top:6px">📅 ' + esc(j.sana) + (j.usta ? ' · 👷 ' + esc(j.usta) : '') + '</div></div>').join('')
    : '<div class="card muted">Hali bizda xizmat olmagansiz. Birinchi ishingizni «🛠 Usta chaqirish» orqali bering.</div>');
  orqUlash(); window.scrollTo(0, 0);
}
/* 5 — mening tizimim */
function tizim() {
  const T = S.turlar || [];
  $('main').innerHTML = orqaga() + '<h2>Mening tizimim</h2>' + (T.length ? '<div class="card">' + T.map(x => '<div class="row" style="padding:6px 0"><span>' + esc(x.t) + '</span><b>' + x.n + ' marta</b></div>').join('') + '</div><p class="muted small" style="margin:8px 4px">Batafsil ma\'lumot va kafolat bo\'yicha savollar uchun — «💬 Savol berish».</p>'
    : '<div class="card muted">Hozircha bizda o\'rnatilgan tizimingiz yo\'q.</div>');
  orqUlash(); window.scrollTo(0, 0);
}
yukla();
</script>
</body>
</html>
