<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Halowatt Servis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#01825F; --green:#42C970; --mint:#98CF8A; --gray:#6A8D88; --mist:#CFDBD9;
    --ice:#E7F2F3; --charcoal:#30403F; --slate:#1F2D2D; --red:#9B1C1C; --orange:#C26A12;
    --bg:#F4F8F8; --card:#FFFFFF; --text:var(--slate); --muted:var(--gray); --line:#E1EBEA; --input:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141E1E; --card:#1F2D2D; --text:#EAF2F1; --muted:#98B0AC; --line:#2C3D3C; --ice:#22403A; --input:#182525; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header{background:var(--teal);color:#fff;padding:16px 16px 14px}
  header .t{font-weight:800;font-size:19px}
  header .s{opacity:.85;font-size:13px;margin-top:3px}
  header{position:sticky;top:0;z-index:20}
  .hst{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .hst div{background:rgba(255,255,255,.14);border-radius:10px;padding:6px 8px;line-height:1.15}
  .hst b{display:block;font-size:16px;font-weight:800;letter-spacing:-.2px}
  .hst span{font-size:10.5px;opacity:.85}
  main{padding:0 12px 12px}
  h2{font-size:15px;margin:18px 4px 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  nav button{flex:1;border:0;background:none;color:var(--muted);font:600 11px Manrope,sans-serif;padding:6px 2px;border-radius:12px}
  nav button .ic{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--teal);background:var(--ice)}
  .seg{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none;border:0;border-radius:20px;padding:8px 14px;font:700 13px Manrope,sans-serif;background:var(--card);color:var(--muted);box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap}
  .seg button.on{background:var(--teal);color:#fff;box-shadow:none}
  .seg .n{opacity:.75;margin-left:4px}
  .search{width:100%;margin:8px 0 2px;border:0;border-radius:12px;padding:11px 14px;font:500 15px Manrope,sans-serif;background:var(--input);color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
  .card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 0 0 1px var(--line) inset}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-weight:800;font-size:17px}
  .time{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;margin-top:6px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:8px;padding:4px 9px;background:var(--ice);color:var(--teal);box-shadow:0 0 0 1px var(--mist) inset}
  .tag.yoq{color:var(--orange);background:#FDF0E2;box-shadow:none}
  .pill.wait{background:#FDF0E2;color:var(--orange)} .pill.work{background:var(--ice);color:var(--teal)}
  .pill.done{background:var(--ice);color:var(--gray)} .pill.otk{background:#FBEAEA;color:var(--red)}
  .jobs{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--ice)}
  .job{display:flex;justify-content:space-between;font-size:14px;padding:2px 0;gap:8px}
  .line{display:flex;gap:8px;font-size:14px;padding:5px 0;align-items:flex-start}
  .line .i{width:20px;text-align:center;flex:none}
  a.tel{color:var(--teal);font-weight:800;text-decoration:none;font-size:16px}
  a.map{color:var(--teal);text-decoration:none}
  .muted{color:var(--muted)} .small{font-size:12px}
  .btn{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;font:800 15px Manrope,sans-serif;background:var(--teal);color:#fff}
  .btn:active{opacity:.8} .btn[disabled]{opacity:.5}
  .btn.ghost{background:var(--ice);color:var(--teal)}
  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .empty .e{font-size:40px;margin-bottom:8px}
  .u{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
  .u:last-child{border-bottom:0}
  .st{font-size:13px;font-weight:700;white-space:nowrap} .st.free{color:var(--green)} .st.busy{color:var(--orange)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .kpi{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--line) inset}
  .kpi b{display:block;font-size:24px;font-weight:800;line-height:1.1}
  .kpi span{font-size:12px;color:var(--muted)}
  .kpi.wide{grid-column:1/-1}
  .bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 0}
  .bar .tr{height:8px;border-radius:4px;background:var(--ice);overflow:hidden}
  .bar .fl{height:100%;background:var(--teal);border-radius:4px}
  .bar .v{font-weight:700;white-space:nowrap}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}

  .in:focus{outline:none;box-shadow:0 0 0 2px var(--teal) inset}
  textarea.in{min-height:70px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:0;border-radius:20px;padding:9px 13px;font:600 13px Manrope,sans-serif;background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line) inset}

  .chip[disabled]{opacity:.45}
  .tur{background:var(--ice);border-radius:12px;padding:10px 12px;margin-top:8px}
  .tur .tn{font-weight:800;font-size:14px;margin-bottom:8px}
  .tur .g{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
  .step{display:flex;align-items:center;background:var(--input);border-radius:10px;box-shadow:0 0 0 1px var(--line) inset}
  .step button{border:0;background:none;font:800 18px Manrope;color:var(--teal);width:36px;height:40px}
  .step span{min-width:28px;text-align:center;font-weight:800}
  .ok{background:var(--ice);border-radius:14px;padding:14px;margin-top:12px;font-size:14px;line-height:1.6}
  .refresh{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:22px;border:0;background:var(--teal);color:#fff;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:15}
  .err{background:#FBEAEA;color:var(--red);border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
  .spin{width:28px;height:28px;border:3px solid var(--mist);border-top-color:var(--teal);border-radius:50%;animation:s .8s linear infinite;margin:60px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .act{flex:1 1 auto;border:0;border-radius:10px;padding:10px 8px;font:700 13px Manrope,sans-serif;background:var(--ice);color:var(--teal)}
  .act.red{background:#FBEAEA;color:var(--red)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end}
  .sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
  .sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .sheet .hd b{font-size:17px}
  .x{border:0;background:var(--card);width:34px;height:34px;border-radius:17px;font-size:16px;color:var(--muted);box-shadow:0 0 0 1px var(--line) inset}
  .uitem{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--card);border-radius:12px;padding:13px 14px;margin:6px 0;font:700 15px Manrope,sans-serif;color:var(--text);box-shadow:0 0 0 1px var(--line) inset;text-align:left}
  .uitem[disabled]{opacity:.45} .uitem.cur{box-shadow:0 0 0 2px var(--teal) inset}
  .mon{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
  .mon button{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--teal);box-shadow:0 0 0 1px var(--line) inset}
  .mon b{font-size:16px}
  .mrow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .mrow span:first-child{color:var(--muted)}
  .neg{color:var(--red)} .pos{color:var(--teal)}
  .champ{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 12px 0;padding:10px 12px;border-radius:14px;background:linear-gradient(135deg,#FFF4D6,#FFE3A0);color:#5A4200;box-shadow:0 0 0 1px #EBCB72 inset}
  .champ b{font-size:15px;display:block;margin-top:1px} .champ .small{font-size:12px;opacity:.85}
  .champ button{border:0;border-radius:12px;padding:9px 12px;font:800 13px Manrope,sans-serif;background:var(--teal);color:#fff;white-space:nowrap}
  .champs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 12px 0} .champs.bir{grid-template-columns:1fr}
  .chc{border:0;text-align:left;border-radius:14px;padding:9px 11px;font-family:Manrope,sans-serif;background:linear-gradient(135deg,#FFF4D6,#FFE3A0);color:#5A4200;box-shadow:0 0 0 1px #EBCB72 inset;min-width:0}
  .chc.o{background:linear-gradient(135deg,#E6F7F0,#C8ECDF);color:#0B5A43;box-shadow:0 0 0 1px #94D5BD inset}
  .chc .small{font-size:11px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .chc b{font-size:14px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chc i{font-style:normal;font-size:12px;font-weight:800;display:inline-block;margin-top:5px;color:var(--teal)}
  .ry{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:#fff;margin:0 0 8px;box-shadow:0 1px 0 var(--line,#e6ece9)}
  .ry .o{width:34px;text-align:center;font-size:22px;font-weight:800;flex:none} .ry .n{flex:1;min-width:0} .ry .n b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ry .n span{font-size:12px;opacity:.75} .ry .s{text-align:right;flex:none} .ry .s b{display:block;font-size:17px} .ry .s span{font-size:11px;opacity:.7}
  .qm h3{font-size:15px;margin:14px 0 6px;color:var(--teal)} .qm ul{margin:0 0 4px;padding-left:18px} .qm li{margin:4px 0;line-height:1.45;font-size:14px} .qm p{margin:6px 0;font-size:14px;line-height:1.45}
  .ry.top{background:linear-gradient(135deg,#FFFBEA,#FFF1C7)} .ry.men{box-shadow:0 0 0 2px var(--teal) inset}
  .tsav{font-size:17px;font-weight:800;margin:14px 2px 10px;line-height:1.4}
  .tbar{height:8px;border-radius:4px;background:var(--mist);overflow:hidden;margin-top:12px} .tbar div{height:100%;width:100%;background:var(--teal);transition:width .25s linear}
  .tsec{text-align:center;font:800 30px Manrope,sans-serif;margin-top:6px}
  .tv{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:12px;padding:13px 14px;margin:7px 0;font:600 15px Manrope,sans-serif;color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
  .tv b{color:var(--teal);margin-right:6px} .tv.sel{box-shadow:0 0 0 2px var(--teal) inset} .tv.ok{background:#DDF3EA;color:#0B3B2C;box-shadow:0 0 0 2px var(--teal) inset} .tv.no{background:#FBE3E3;color:#5B1010;box-shadow:0 0 0 2px var(--red) inset} .tv[disabled]{opacity:1}
  /* ⏳ Kutish: tugma ichi to'ladi + tepada ingichka chiziq (har bir server so'rovi) */
  .btn.yuk,.act.yuk,.chip.yuk{position:relative;overflow:hidden;opacity:1!important}
  .btn.yuk::after,.act.yuk::after,.chip.yuk::after{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.32);animation:tol 6s cubic-bezier(.15,.75,.3,1) forwards;pointer-events:none}
  .act.yuk::after,.chip.yuk::after{background:rgba(1,130,95,.22)}
  @keyframes tol{0%{width:0}100%{width:94%}}
  #yb{position:fixed;left:0;top:0;height:3px;width:0;background:#7EE2BE;z-index:9999;opacity:0;pointer-events:none;transition:opacity .35s}
  #yb.on{opacity:1;animation:tol 5s cubic-bezier(.15,.75,.3,1) forwards}
  #yb.tug{opacity:0;width:100%!important;animation:none;transition:width .25s,opacity .5s .2s}
</style>
</head>
<body>
<div id="yb"></div>
<header><div class="t">Halowatt · Servis</div><div class="s" id="sub">Yuklanmoqda…</div><div class="hst" id="hst" hidden></div></header>
<div id="top" hidden></div>
<main id="main"><div class="spin"></div></main>
<button class="refresh" id="ref" title="Yangilaş" hidden>⟳</button>
<nav id="nav" hidden></nav>

<script>
const API = 'https://script.google.com/macros/s/AKfycbytPwCL-MZPwtpr3swxDePb4oKkduTxQmbasS2ZC251Wr2sI0lDcvwIHyBYCd1LJEyeSg/exec';
/* 📊 Tepada doim: jami bajarilgan işlar (usta varaqlari + amoCRM + eski baza) — saytdagi bilan bir xil manba */
(function hst() {
  const fm = n => String(n).replace(/\B(?=(\d{3})+$)/g, '\u00a0');
  const chiz = d => { const el = document.getElementById('hst'); if (!el || !d || !d.ok) return; el.hidden = false;
    el.innerHTML = '<div><b>' + fm(d.jami) + '</b><span>bajarilgan iş</span></div><div><b>' + fm(d.qurilma) + '</b><span>örnatilgan qurilma</span></div><div><b>' + fm(d.servis) + '</b><span>servis iş</span></div>'; };
  try { chiz(JSON.parse(localStorage.getItem('hw_hst') || 'null')); } catch (e) {}
  fetch(API + '?sayt=stat').then(r => r.json()).then(d => { if (d && d.ok) { chiz(d); try { localStorage.setItem('hw_hst', JSON.stringify(d)); } catch (e) {} } }).catch(() => {});
})();
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#01825F'); } catch (e) {} }

let ishFil = '';
let YOP_H = (() => { try { return new URLSearchParams(location.search).get('yop') || ''; } catch (e) { return ''; } })();
let D = null, ekran = (() => { try { return new URLSearchParams(location.search).get('test') === '1' ? 'test' : new URLSearchParams(location.search).get('reyting') === '1' ? 'reyting' : (new URLSearchParams(location.search).get('e') || null); } catch (e) { return null; } })(), seg = {}, qidir = '', davr = 'oy', F = null, natija = null, MOL = {}, moliyaOy = null, bT = '', bF = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 🔤 Yangi alifbo (2026) — server/jadvaldan keladigan yorliqlarni faqat KO'RSATISHDA o'giradi (qiymat o'zgarmaydi) */
const ya = s => String(s == null ? '' : s).replace(/([OoGg])['’‘`ʻ]/g, (m, h) => ({ O: 'Ö', o: 'ö', G: 'Ğ', g: 'ğ' })[h]).replace(/SH|Sh|sh|CH|Ch|ch/g, m => ({ SH: 'Ş', Sh: 'Ş', sh: 'ş', CH: 'Ç', Ch: 'Ç', ch: 'ç' })[m]).replace(/([A-Za-zÖöĞğŞşÇç])['’](?=[a-zöğşç])/g, '$1ʼ');
const pul = n => n == null || n === '' || isNaN(n) ? '' : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " söm";
const mln = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + ' mln' : pul(n);
const dav = m => { if (m == null || isNaN(m)) return '—'; m = Math.round(m); const k = Math.floor(m / 1440), s = Math.floor(m % 1440 / 60), d = m % 60;
  return k ? k + ' kun' + (s ? ' ' + s + ' soat' : '') : s ? s + ' soat' + (d ? ' ' + d + ' daq' : '') : (d || 1) + ' daq'; };
const ort = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const hap = t => { try { tg && tg.HapticFeedback[t === 'sel' ? 'selectionChanged' : 'notificationOccurred'](t === 'sel' ? undefined : t); } catch (e) {} };
const xabar = m => tg && tg.showAlert ? tg.showAlert(m) : alert(m);

let _yb = 0;
const chiziq = d => { _yb = Math.max(0, _yb + d); const e = $('yb'); if (!e) return;
  if (_yb > 0) { if (!e.classList.contains('on')) { e.classList.remove('tug'); void e.offsetWidth; e.classList.add('on'); } }
  else { e.classList.remove('on'); e.classList.add('tug'); } };
async function api(body) {
  chiziq(1);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : '' }, body)) });
    return await r.json();
  } finally { chiziq(-1); }
}
/* Tugma «…» yozuvi bilan o'chirilsa — ichi to'la boshlaydi; qayta yoqilsa — to'xtaydi (hamma joyda avtomatik) */
new MutationObserver(M => M.forEach(m => { const b = m.target;
  if (!b.classList || !b.matches('button')) return;
  if (b.disabled && /…|\.\.\./.test(b.textContent)) b.classList.add('yuk'); else b.classList.remove('yuk');
})).observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['disabled'] });
/* ⚡ Telefon xotirasi — oxirgi ma'lumot darhol ko'rinadi, yangisi orqada keladi */
const LS = 'hw1:' + ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0) + ':';
function lsOl(k) { try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsQoy(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { try { localStorage.removeItem(LS + k); } catch (e2) {} } }
function molTozala() { MOL = {}; for (const k in TRX) delete TRX[k]; for (const k in TY) delete TY[k]; try { Object.keys(localStorage).forEach(k => { if (k.indexOf(LS + 'M') === 0 || k.indexOf(LS + 'T') === 0) localStorage.removeItem(k); }); } catch (e) {} }
const bandMi = () => !!$('ov') || ekran === 'yangi' || ekran === 'test';
async function yukla(jim) {
  let eski = false;
  if (!jim) {
    const c = !D && lsOl('D' + (ARX ? 1 : 0));
    if (c && c.ok && c.ruxsat) {
      D = c; eski = true;
      try { chiz(); $('sub').textContent += ' · ⟳'; } catch (e) { eski = false; $('main').innerHTML = '<div class="spin"></div>'; }
    } else $('main').innerHTML = '<div class="spin"></div>';
  }
  try {
    const Y = await api({ api: 'ishlar', arxiv: ARX });
    if (!Y.ok) throw new Error(Y.xato || 'Xatolik');
    D = Y; lsQoy('D' + (ARX ? 1 : 0), Y);
    if (eski && bandMi()) { $('sub').textContent = $('sub').textContent.replace(' · ⟳', ''); if (!T) testYukla().catch(() => {}); return; }
    const yopH = YOP_H; YOP_H = '';
    const yi = yopH && (D.ustaIshlari || []).find(x => x.h === yopH);
    if (yi && !yi.yopildi && !yi.otkaz) ekran = 'usta';
    chiz();
    if (!T) testYukla().catch(() => {});

    catch (e) { xabar('⚠️ ' + e.message); } b.disabled = false; b.textContent = '📄 Şu davrni Excelʼga yuklaş'; };

const pr = (a, b) => a == null || !b ? 0 : Math.max(3, Math.round(a / b * 100));

  $('f_yubor').onclick = async () => {

      if (!r.ok) throw new Error(r.xato || 'Saqlanmadi');

    } catch (e) { btn.disabled = false; btn.textContent = '💾 Saqlaş va yuboriş'; hap('error'); xabar('⚠️ ' + e.message); }

/* «➕ Yangi»: telefon bo'yicha mijoz tarixi (LTV) */
function mijozFormaHtml(r) {

  const qat = (i, t, st) => '<div class="line small"' + (st ? ' style="' + st + '"' : '') + '><span class="i">' + i + '</span><span>' + t + '</span></div>';
  if (r.m) {
    const m = r.m, x = m.ox, ism = String(m.ism || '').replace(/\s+\d{4}$/, '');

      '<div style="font-weight:800;color:var(--orange);margin-bottom:4px">🔁 Takroriy mijoz — ' + (m.mur + 1) + '-marta murojaat</div>' +
      qat('👤', '<b>' + esc(ism) + '</b>' + (m.birinchi ? ' · birinçi iş: ' + esc(m.birinchi) : '')) +
      qat('💰', 'Jami: <b>' + (m.summa ? pul(m.summa) : '—') + '</b> · ✅ ' + m.ish + ' ta iş' + (m.otkaz ? ' · ❌ ' + m.otkaz + ' otkaz' : '')) +
      (x ? qat('🛠', 'Oxirgi: <b>' + esc(x.sana) + '</b> · ' + esc(x.turi) + (x.usta ? ' · usta <b>' + esc(x.usta) + '</b>' : '') +
        (x.baho ? ' · ⭐ ' + x.baho.o + ' / 5' + (x.baho.past ? ' 😞' : '') : '')) : '') +
      (m.ochiq ? qat('⏳', '<b>Hozir oçiq işi bor</b>' + (m.ochiqTuri ? ' — ' + esc(m.ochiqTuri) : '') + (m.ochiqUsta ? ' · usta <b>' + esc(m.ochiqUsta) + '</b>' : ' · usta hali yöq') + '. Ikki marta kiritmang!', 'color:var(--red)')
        : x && x.holat !== 'otkaz' && x.kun != null && x.kun <= 30 ? qat('⚠️', '<b>' + x.kun + ' kun oldin</b> iş qilingan — takroriy nosozlik bölişi mumkin', 'color:var(--red)') : '') +
      '<button class="act" id="f_mk" data-k="' + esc(m.k) + '" style="margin-top:8px">👤 Kartoçkani oçiş</button></div>';
  }
  const och = r.ochiq ? qat('⏳', '<b>Hozir oçiq işi bor</b>. Ikki marta kiritmang!', 'color:var(--red);margin:6px 2px') : '';
  if (r.tarix) { const t = r.tarix;
    return och + qat('🔁', '<b>Takroriy mijoz</b> — oldin ' + t.n + ' marta. Oxirgisi: ' + esc(t.sana) + (t.usta ? ', ' + esc(t.usta) : '') + (t.turi ? ' (' + esc(t.turi) + ')' : '') + (t.mijoz ? ' — ' + esc(t.mijoz) : ''), 'color:var(--orange);margin:6px 2px'); }
  if (r.yangi) return qat('🆕', '<b>Yangi mijoz</b> — bazada yöq', 'color:var(--teal);margin:6px 2px');
  return '';
}

/* ⭐ Mijoz bahosi — usta ishni yopgach telefonni mijozga beradi */
const BAHO_S = ['⏰ Usta vaqtida keldimi?', '🛠 Iş sifati sizni qoniqtirdimi?', '🧹 Usta işdan keyin joyni toza qoldirdimi?', '🤝 Ustaning muomalasi qanday böldi?', '📱 Usta tizimdan foydalanişni tuşuntirib berdimi?'];
const BAHO_T = [[1, '😞', 'Qoniqarsiz'], [3, '🙂', 'Qoniqarli'], [5, '🤩', 'Aʼlo']];
function bahoSorov(h, keyin) {
  const J = BAHO_S.map(() => 0);
  const i = ishTop(h);
  oyna('⭐ Mijoz bahosi', '<p class="muted small" style="margin:0 2px 10px">Telefonni mijozga bering. Har savolga bittadan javob tanlang' + (i ? ' — <b>' + esc(i.mijoz) + '</b>' : '') + '.</p>' +
    BAHO_S.map((s, k) => '<div class="card" style="padding:12px"><div style="font-weight:700;margin-bottom:8px">' + (k + 1) + '. ' + esc(s) + '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">' + BAHO_T.map(t => '<button class="chip" data-bq="' + k + '" data-bv="' + t[0] + '" style="display:flex;flex-direction:column;align-items:center;padding:10px 4px;font-size:13px"><span style="font-size:24px">' + t[1] + '</span>' + t[2] + '</button>').join('') + '</div></div>').join('') +
    '<button class="btn" id="bh_ok" disabled>✅ Yuboriş</button><button class="btn ghost" id="bh_otk" style="margin-top:8px">⏭ Ötkazib yuboriş</button>');
  document.querySelectorAll('[data-bq]').forEach(b => b.onclick = () => {
    const k = +b.dataset.bq; J[k] = +b.dataset.bv; hap('sel');
    document.querySelectorAll('[data-bq="' + k + '"]').forEach(x => x.classList.toggle('on', x === b));
    $('bh_ok').disabled = J.some(x => !x);
  });
  const yubor = async (body, btn) => {
    btn.disabled = true; const t0 = btn.textContent; btn.textContent = 'Yuborilmoqda…';
    try { const r = await api(Object.assign({ api: 'baho', h }, body)); if (!r.ok) throw new Error(r.xato);
      hap('success'); yop(); const t = body.otkaz ? '' : '🙏 Rahmat! Fikringiz biz uçun muhim.'; if (keyin) keyin(t); else { if (t) xabar(t); molTozala(); yukla(true); }
    } catch (e) { btn.disabled = false; btn.textContent = t0; hap('error'); xabar('⚠️ ' + e.message); }
  };
  $('bh_ok').onclick = () => yubor({ javob: J }, $('bh_ok'));
  $('bh_otk').onclick = () => { const go = () => yubor({ otkaz: true }, $('bh_otk'));
    tg && tg.showConfirm ? tg.showConfirm('Mijoz bahosiz qoldirilsinmi? Bu ham qayd qilinadi.', y => y && go()) : go(); };
}
const bahoBelgi = b => !b ? '' : b.holat === 'O\'tkazildi' ? '⏭ Baho ötkazilgan' : '⭐ Mijoz bahosi: ' + b.o + ' / 5' + (b.past ? ' · 😞 qoniqmagan' : '');
function tugat(h, btn) {
  const R = [];   // tayyor JPEG (dataURL)
  oyna('✅ Işni tugatiş', '<p class="muted small" style="margin:0 2px 10px">📸 Örnatilgan <b>har bir joyning</b> rasmini yuklang (20 tagaça). <b>Rasmsiz iş yopilmaydi.</b></p>' +
    '<div id="rp" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px"></div>' +
    '<label class="btn ghost" id="rl" style="display:block;text-align:center;cursor:pointer">📷 Rasm qöşiş<input type="file" accept="image/*" multiple id="rf" style="display:none"></label>' +
    '<div id="stk"><div class="card muted small" style="padding:12px">🏷 Stiker tekşirilmoqda…</div></div>' +
    (ishTop(h) ? tolovMaydon(ishTop(h)) : '') +
    '<button class="btn" id="r_ok" disabled>✅ Işni yopiş</button>');
  tolovUlash();
  /* 🏷 Stiker: mijozda hali bo'lmasa — yopishtirilgan stiker rasmi yoki sabab majburiy */
  const S = { kerak: null, rasm: '', sabab: '' };
  const tayyor = () => !!R.length && S.kerak !== null && (!S.kerak || !!S.rasm || !!S.sabab);
  const tugmaYangila = () => { if ($('r_ok') && !$('r_ok').textContent.includes('…')) $('r_ok').disabled = !tayyor(); };
  const chizS = (sabablar) => {
    const el = $('stk'); if (!el) return;
    if (!S.kerak) { el.innerHTML = '<div class="card small" style="padding:12px">🏷 Bu mijozda Halowatt stikeri bor ✅</div>'; return tugmaYangila(); }
    el.innerHTML = '<div class="card" style="padding:12px"><div style="font-weight:700;margin-bottom:6px">🏷 Stiker</div>' +
      '<p class="muted small" style="margin:0 0 10px">Mijozning NVR / kamera yoniga yangi Halowatt stikerini yopiştiring (eski stiker bölsa — ustidan) va <b>rasmini</b> yuklang.</p>' +
      (S.rasm ? '<div style="position:relative;margin-bottom:8px"><img src="' + S.rasm + '" style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;display:block"><button id="sx" style="position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff">✕</button></div>' :
        S.sabab ? '' : '<label class="btn ghost" style="display:block;text-align:center;cursor:pointer;margin-bottom:8px">📷 Stiker rasmi<input type="file" accept="image/*" capture="environment" id="sf" style="display:none"></label>') +
      (S.rasm ? '' : '<div class="muted small" style="margin:4px 2px 6px">Yopiştira olmadingizmi? Sababini tanlang:</div><div style="display:flex;flex-wrap:wrap;gap:6px">' +
        sabablar.map(x => '<button class="chip' + (S.sabab === x ? ' on' : '') + '" data-ss="' + esc(x) + '">' + esc(ya(x)) + '</button>').join('') + '</div>') + '</div>';
    if ($('sx')) $('sx').onclick = () => { S.rasm = ''; chizS(sabablar); };
    if ($('sf')) $('sf').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { S.rasm = await kichrayt(f); S.sabab = ''; hap('sel'); } catch (x) { xabar('⚠️ ' + x.message); } chizS(sabablar); };
    document.querySelectorAll('[data-ss]').forEach(b => b.onclick = () => { S.sabab = S.sabab === b.dataset.ss ? '' : b.dataset.ss; hap('sel'); chizS(sabablar); });
    tugmaYangila();
  };
  api({ api: 'stikerHolat', h }).then(r => { S.kerak = r.ok ? !!r.kerak : false; if (r.ok && r.ochiq === false) { if ($('stk')) $('stk').innerHTML = ''; return tugmaYangila(); } chizS((r && r.sabablar) || []); })
    .catch(() => { S.kerak = false; chizS([]); });
  const chizR = () => {
    $('rp').innerHTML = R.map((d, k) => '<div style="position:relative"><img src="' + d + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block">' +
      '<button data-rx="' + k + '" style="position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff">✕</button></div>').join('');
    document.querySelectorAll('[data-rx]').forEach(b => b.onclick = () => { R.splice(+b.dataset.rx, 1); chizR(); });
    $('r_ok').disabled = !tayyor(); $('rl').style.display = R.length >= 20 ? 'none' : 'block'; $('rl').firstChild.textContent = R.length ? '📷 Yana rasm qöşiş (' + R.length + ' / 20)' : '📷 Rasm qöşiş';
  };
  const kichrayt = f => new Promise((ok, no) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.7)); };
    im.onerror = () => { URL.revokeObjectURL(u); no(new Error('Rasmni öqib bölmadi')); };
    im.src = u;
  });
  $('rf').onchange = async e => {
    for (const f of [...e.target.files].slice(0, 20 - R.length)) { try { R.push(await kichrayt(f)); } catch (x) { xabar('⚠️ ' + x.message); } }
    e.target.value = ''; hap('sel'); chizR();
  };
  $('r_ok').onclick = async () => {
    if (!R.length) return xabar('📸 Kamida 1 ta rasm yuklang.');
    if (S.kerak && !S.rasm && !S.sabab) return xabar('🏷 Stiker rasmini yuklang yoki sababini tanlang.');
    const tl = ishTop(h) ? tolovOl() : {}; if (!tl) return;
    const b = $('r_ok'); b.disabled = true; b.textContent = 'Yuklanmoqda…';
    try {
      if (R.length > 10) b.textContent = 'Yuklanmoqda… 10 / ' + R.length;
      const r = await api(Object.assign({ api: 'tugatdim', h, rasmlar: R.slice(0, 10) }, S.kerak ? (S.rasm ? { stiker: S.rasm } : { stikerSabab: S.sabab }) : {}, tl));
      if (!r.ok) throw new Error(r.xato);
      if (!r.oldin) for (let i = 10; i < R.length; i += 10) {
        b.textContent = 'Yuklanmoqda… ' + Math.min(i + 10, R.length) + ' / ' + R.length;
        try { const q = await api({ api: 'rasmQosh', h, rasmlar: R.slice(i, i + 10) }); if (q.ok) r.rasm = q.jami; } catch (x) {}
      }
      hap('success'); yop(); if (btn) { btn.disabled = true; btn.textContent = '✅ Yopildi'; }
      const m = r.oldin ? '✅ Bu iş allaqaçon yopilgan.' : '✅ Iş yopildi — ' + r.vaqt + '\n📸 ' + r.rasm + ' ta rasm saqlandi.' + (r.stiker === 'Yopishtirildi' ? '\n🏷 Stiker rasmi saqlandi.' : r.stiker ? '\n🏷 Stiker ötkazildi (sabab rahbarga yuborildi).' : '') + (r.tolov ? '\n💵 Tölov rahbar tasdiğiga yuborildi.' : r.tolovXato ? '\n⚠️ Tölov: ' + r.tolovXato : '');
      if (r.oldin) { xabar(m); molTozala(); await yukla(true); }
      else bahoSorov(h, t => { xabar((t ? t + '\n\n' : '') + m); molTozala(); yukla(true); });
    } catch (x) { b.textContent = '✅ Işni yopiş'; b.disabled = !tayyor(); hap('error'); xabar('⚠️ ' + x.message); }
  };
}

function qlnHtml(t) {
