<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Halowatt Servis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#01825F; --green:#42C970; --mint:#98CF8A; --gray:#6A8D88; --mist:#CFDBD9;
    --ice:#E7F2F3; --charcoal:#30403F; --slate:#1F2D2D; --red:#9B1C1C; --orange:#C26A12;
    --bg:#F4F8F8; --card:#FFFFFF; --text:var(--slate); --muted:var(--gray); --line:#E1EBEA; --input:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141E1E; --card:#1F2D2D; --text:#EAF2F1; --muted:#98B0AC; --line:#2C3D3C; --ice:#22403A; --input:#182525; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif}
  body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  header{background:var(--teal);color:#fff;padding:16px 16px 14px}
  header .t{font-weight:800;font-size:19px}
  header .s{opacity:.85;font-size:13px;margin-top:3px}
  main{padding:0 12px 12px}
  h2{font-size:15px;margin:18px 4px 8px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  nav button{flex:1;border:0;background:none;color:var(--muted);font:600 11px Manrope,sans-serif;padding:6px 2px;border-radius:12px}
  nav button .ic{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--teal);background:var(--ice)}
  .seg{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none;border:0;border-radius:20px;padding:8px 14px;font:700 13px Manrope,sans-serif;background:var(--card);color:var(--muted);box-shadow:0 0 0 1px var(--line) inset;white-space:nowrap}
  .seg button.on{background:var(--teal);color:#fff;box-shadow:none}
  .seg .n{opacity:.75;margin-left:4px}
  .search{width:100%;margin:8px 0 2px;border:0;border-radius:12px;padding:11px 14px;font:500 15px Manrope,sans-serif;background:var(--input);color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
  .card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 0 0 1px var(--line) inset}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-weight:800;font-size:17px}
  .time{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;margin-top:6px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;border-radius:8px;padding:4px 9px;background:var(--ice);color:var(--teal);box-shadow:0 0 0 1px var(--mist) inset}
  .tag.yoq{color:var(--orange);background:#FDF0E2;box-shadow:none}
  .pill.wait{background:#FDF0E2;color:var(--orange)} .pill.work{background:var(--ice);color:var(--teal)}
  .pill.done{background:var(--ice);color:var(--gray)} .pill.otk{background:#FBEAEA;color:var(--red)}
  .jobs{margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--ice)}
  .job{display:flex;justify-content:space-between;font-size:14px;padding:2px 0;gap:8px}
  .line{display:flex;gap:8px;font-size:14px;padding:5px 0;align-items:flex-start}
  .line .i{width:20px;text-align:center;flex:none}
  a.tel{color:var(--teal);font-weight:800;text-decoration:none;font-size:16px}
  a.map{color:var(--teal);text-decoration:none}
  .muted{color:var(--muted)} .small{font-size:12px}
  .btn{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;padding:14px;font:800 15px Manrope,sans-serif;background:var(--teal);color:#fff}
  .btn:active{opacity:.8} .btn[disabled]{opacity:.5}
  .btn.ghost{background:var(--ice);color:var(--teal)}
  .empty{text-align:center;padding:48px 20px;color:var(--muted)}
  .empty .e{font-size:40px;margin-bottom:8px}
  .u{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
  .u:last-child{border-bottom:0}
  .st{font-size:13px;font-weight:700;white-space:nowrap} .st.free{color:var(--green)} .st.busy{color:var(--orange)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .kpi{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 0 0 1px var(--line) inset}
  .kpi b{display:block;font-size:24px;font-weight:800;line-height:1.1}
  .kpi span{font-size:12px;color:var(--muted)}
  .kpi.wide{grid-column:1/-1}
  .bar{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;padding:6px 0}
  .bar .tr{height:8px;border-radius:4px;background:var(--ice);overflow:hidden}
  .bar .fl{height:100%;background:var(--teal);border-radius:4px}
  .bar .v{font-weight:700;white-space:nowrap}
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th{font-size:11px;color:var(--muted);text-align:right;font-weight:700;padding:4px 2px}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl td{padding:8px 2px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
  .tbl td:first-child{font-weight:700;white-space:normal}
  label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 6px}
  .in{width:100%;border:0;border-radius:12px;padding:12px 14px;font:500 16px Manrope,sans-serif;background:var(--input);color:var(--text);box-shadow:0 0 0 1px var(--line) inset;-webkit-appearance:none}
  .in:focus{outline:none;box-shadow:0 0 0 2px var(--teal) inset}
  textarea.in{min-height:70px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:0;border-radius:20px;padding:9px 13px;font:600 13px Manrope,sans-serif;background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--line) inset}
  .chip.on{background:var(--teal);color:#fff;box-shadow:none}
  .chip[disabled]{opacity:.45}
  .tur{background:var(--ice);border-radius:12px;padding:10px 12px;margin-top:8px}
  .tur .tn{font-weight:800;font-size:14px;margin-bottom:8px}
  .tur .g{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
  .step{display:flex;align-items:center;background:var(--input);border-radius:10px;box-shadow:0 0 0 1px var(--line) inset}
  .step button{border:0;background:none;font:800 18px Manrope;color:var(--teal);width:36px;height:40px}
  .step span{min-width:28px;text-align:center;font-weight:800}
  .ok{background:var(--ice);border-radius:14px;padding:14px;margin-top:12px;font-size:14px;line-height:1.6}
  .refresh{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:22px;border:0;background:var(--teal);color:#fff;font-size:19px;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:15}
  .err{background:#FBEAEA;color:var(--red);border-radius:12px;padding:12px;margin:12px 0;font-size:14px}
  .spin{width:28px;height:28px;border:3px solid var(--mist);border-top-color:var(--teal);border-radius:50%;animation:s .8s linear infinite;margin:60px auto}
  @keyframes s{to{transform:rotate(360deg)}}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .act{flex:1 1 auto;border:0;border-radius:10px;padding:10px 8px;font:700 13px Manrope,sans-serif;background:var(--ice);color:var(--teal)}
  .act.red{background:#FBEAEA;color:var(--red)}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end}
  .sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
  .sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .sheet .hd b{font-size:17px}
  .x{border:0;background:var(--card);width:34px;height:34px;border-radius:17px;font-size:16px;color:var(--muted);box-shadow:0 0 0 1px var(--line) inset}
  .uitem{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:var(--card);border-radius:12px;padding:13px 14px;margin:6px 0;font:700 15px Manrope,sans-serif;color:var(--text);box-shadow:0 0 0 1px var(--line) inset;text-align:left}
  .uitem[disabled]{opacity:.45} .uitem.cur{box-shadow:0 0 0 2px var(--teal) inset}
  .mon{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
  .mon button{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;font-size:18px;color:var(--teal);box-shadow:0 0 0 1px var(--line) inset}
  .mon b{font-size:16px}
  .mrow{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
  .mrow span:first-child{color:var(--muted)}
  .neg{color:var(--red)} .pos{color:var(--teal)}
</style>
</head>
<body>
<header><div class="t">Halowatt · Servis</div><div class="s" id="sub">Yuklanmoqda…</div></header>
<main id="main"><div class="spin"></div></main>
<button class="refresh" id="ref" title="Yangilash" hidden>⟳</button>
<nav id="nav" hidden></nav>

<script>
const API = 'https://script.google.com/macros/s/AKfycbytPwCL-MZPwtpr3swxDePb4oKkduTxQmbasS2ZC251Wr2sI0lDcvwIHyBYCd1LJEyeSg/exec';
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#01825F'); } catch (e) {} }

let ishFil = '';
let D = null, ekran = null, seg = {}, qidir = '', davr = 'oy', F = null, natija = null, MOL = {}, moliyaOy = null, bT = '', bF = '';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pul = n => n == null || n === '' || isNaN(n) ? '' : String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm";
const mln = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + ' mln' : pul(n);
const dav = m => { if (m == null || isNaN(m)) return '—'; m = Math.round(m); const k = Math.floor(m / 1440), s = Math.floor(m % 1440 / 60), d = m % 60;
  return k ? k + ' kun' + (s ? ' ' + s + ' soat' : '') : s ? s + ' soat' + (d ? ' ' + d + ' daq' : '') : (d || 1) + ' daq'; };
const ort = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const hap = t => { try { tg && tg.HapticFeedback[t === 'sel' ? 'selectionChanged' : 'notificationOccurred'](t === 'sel' ? undefined : t); } catch (e) {} };
const xabar = m => tg && tg.showAlert ? tg.showAlert(m) : alert(m);

async function api(body) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ initData: tg ? tg.initData : '' }, body)) });
  return r.json();
}
async function yukla(jim) {
  if (!jim) $('main').innerHTML = '<div class="spin"></div>';
  try {
    D = await api({ api: 'ishlar', arxiv: ARX });
    if (!D.ok) throw new Error(D.xato || 'Xatolik');
    chiz();
  } catch (e) {
    $('main').innerHTML = '<div class="err">⚠️ ' + esc(e.message) + '</div>';
    $('sub').textContent = 'Ulanib bo\'lmadi';
  }
}

/* ---------- Rol va menyu ---------- */
function menyu() {
  const r = D.rol;
  if (r.admin) return [['stat', '📊', 'Statistika'], ['ishlar', '📋', 'Ishlar'], ['ustalar', '👷', 'Ustalar'], ['moliya', '💰', 'Moliya'], ['eslatma', '👥', 'Mijozlar'], ['yangi', '➕', 'Yangi']];
  if (r.xodim) return [['yangi', '➕', 'Yangi ish'], ['mening', '📋', 'Bergan ishlarim'], ['ustalar', '👷', 'Ustalar']].concat(r.usta ? [['usta', '🔧', 'Usta ishlarim'], ['bosh', '🆓', 'Bo\'sh ishlar']] : []);
  return [['usta', '🔧', 'Ishlarim'], ['bosh', '🆓', 'Bo\'sh ishlar'], ['bajarilgan', '✅', 'Bajarilgan'], ['moliya', '💰', 'Balans']];
}
function chiz() {
  const r = D.rol;
  if (!D.ruxsat) {
    $('sub').textContent = r.ism; $('nav').hidden = true; $('ref').hidden = true;
    $('main').innerHTML = '<div class="empty"><div class="e">🔒</div><b>Ruxsat yo\'q</b><br><br>Botga /start yozing — so\'rovingiz adminga boradi. Ruxsat berilgach shu yerdan foydalanasiz.</div>';
    return;
  }
  $('sub').textContent = [r.admin ? 'Rahbar' : '', r.xodim ? r.xodim + (r.filial ? ' · ' + r.filial : '') : '', r.usta ? '👷 ' + r.usta : ''].filter(Boolean).join(' · ') || r.ism;
  const M = menyu();
  if (!ekran || !M.some(m => m[0] === ekran)) ekran = M[0][0];
  $('nav').hidden = false;
  $('nav').innerHTML = M.map(m => '<button data-e="' + m[0] + '" class="' + (m[0] === ekran ? 'on' : '') + '"><span class="ic">' + m[1] + '</span>' + m[2] + '</button>').join('');
  [...$('nav').children].forEach(b => b.onclick = () => { ekran = b.dataset.e; natija = null; hap('sel'); chiz(); window.scrollTo(0, 0); });
  $('ref').hidden = ekran === 'yangi';
  ({ stat: ekStat, ishlar: ekIshlar, ustalar: ekUstalar, yangi: ekYangi, mening: ekMening, usta: ekUsta, bajarilgan: ekBajarilgan, moliya: ekMoliya, bosh: ekBosh, eslatma: ekEslatma })[ekran]();
}

/* ---------- Umumiy: ish kartasi va ro'yxat ---------- */
function holatPill(i) {
  if (i.otkaz) return '<span class="pill otk">❌ Otkaz' + (i.sabab ? ' · ' + esc(i.sabab) : '') + '</span>';
  if (i.yopildi) return '<span class="pill done">✅ ' + esc(i.yopVaqt) + (i.jamiMin != null ? ' · ' + dav(i.jamiMin) : '') + '</span>';
  if (!i.usta) return '<span class="pill wait">⏳ Usta kutilmoqda · ' + dav(i.tushganMin) + '</span>' + (i.sorovlar && i.sorovlar.length ? ' <span class="pill work">🙋 ' + esc(i.sorovlar.map(x => x.usta).join(', ')) + '</span>' : '');
  return '<span class="pill work">🔧 ' + esc(i.usta) + (i.ustadaMin != null ? ' · ' + dav(i.ustadaMin) : '') + '</span>';
}
function karta(i, tugma) {
  const jami = i.ishlar.reduce((s, x) => s + (x.summa || 0), 0);
  const map = i.manzil ? 'https://yandex.uz/maps/?text=' + encodeURIComponent(i.manzil + ", Qo'qon") : '';
  const fil = String(i.filial || '').replace(/^Qo.qon\s*/i, '');
  const teglar = '<div class="tags"><span class="tag">🏢 ' + esc(fil || 'Filial —') + '</span>' +
    (i.usta ? '<span class="tag">👷 ' + esc(i.usta) + '</span>' : (i.otkaz ? '' : '<span class="tag yoq">👷 Usta yo\'q</span>')) + '</div>';
  return '<div class="card"><div class="row"><div><div class="name">' + esc(i.mijoz || '—') + '</div>' + holatPill(i) + teglar + '</div>' +
    '<div class="time">' + esc(i.sana) + '<br>' + esc(i.vaqt) + '</div></div>' +
    '<div class="jobs">' + i.ishlar.map(x => '<div class="job"><span><b>' + esc(x.turi) + '</b> × ' + x.soni + '</span><span>' + pul(x.summa) + '</span></div>').join('') +
      (i.ishlar.length > 1 && jami ? '<div class="job" style="border-top:1px solid var(--mist);margin-top:4px;padding-top:6px"><b>Jami</b><b>' + pul(jami) + '</b></div>' : '') + '</div>' +
    (i.tel ? '<div class="line"><span class="i">📞</span><a class="tel" href="tel:' + esc(i.tel) + '">' + esc(i.tel) + '</a></div>' : '') +
    (i.manzil ? '<div class="line"><span class="i">📍</span><a class="map" href="' + map + '" target="_blank">' + esc(i.manzil) + '</a></div>' : '') +
    (i.izoh ? '<div class="line"><span class="i">📝</span><span>' + esc(i.izoh) + '</span></div>' : '') +
    '<div class="line muted"><span class="i">🏢</span><span>' + esc(i.filial || '—') + (i.shaxs ? ' · ' + esc(i.shaxs) : '') + '</span></div>' +
    (i.otkaz ? '<div class="line" style="color:var(--red)"><span class="i">❌</span><span>' + (!i.sabab || /ko.rsatilmagan/i.test(i.sabab) ? '<b>Otkaz sababi belgilanmagan</b>' : 'Otkaz sababi: <b>' + esc(i.sabab) + '</b>') + '</span></div>' : '') +
    (i.yopildi && i.kutishMin != null ? '<div class="line muted small"><span class="i">⏱</span><span>Ustaga berilguncha ' + dav(i.kutishMin) + ' · usta ' + dav(i.ustaMin) + '</span></div>' : '') +
    (i.yopildi && !i.otkaz && i.tolov ? '<div class="line small" style="color:' + (i.tolov.holat === 'Tasdiqlandi' ? 'var(--teal)' : 'var(--orange)') + '"><span class="i">💵</span><span>' +
      (i.tolov.holat === 'Tasdiqlandi' ? 'To\'lov tasdiqlangan' : 'To\'lov tasdiq kutmoqda') + ': <b>' + pul(i.tolov.summa) + '</b> · ' + esc(i.tolov.usul) + '</span></div>' : '') +
    (tugma && !i.yopildi && !i.otkaz ? '<button class="btn" data-yop="' + esc(i.h) + '">✅ Ishni tugatdim</button>' : '') + amallar(i) + '</div>';
}
/* Ish kartasidagi amallar — huquqqa qarab */
function amallar(i) {
  const r = D.rol, ochiq = !i.yopildi && !i.otkaz, b = [];
  if (ochiq && (r.admin || (r.xodim && i.shaxs === r.xodim))) b.push(['usta', i.usta ? '🔁 Ustani almashtirish' : '👷 Usta biriktirish', '']);
  if (ochiq && r.admin) { b.push(['tahrir', '✏️ Tahrirlash', '']); b.push(['otkaz', '❌ Otkaz', 'red']); }
  if (i.otkaz && r.admin) b.push(['sabab', !i.sabab || /ko.rsatilmagan/i.test(i.sabab) ? '📝 Otkaz sababini belgilash' : '📝 Sababni o\'zgartirish', !i.sabab || /ko.rsatilmagan/i.test(i.sabab) ? 'red' : '']);
  if (r.admin && ochiq && !i.usta && i.sorovlar && i.sorovlar.length) i.sorovlar.forEach(x => { b.push(['olb:' + x.id, '🙋 ' + x.usta + 'ga berish', '']); b.push(['olr:' + x.id, '✕ ' + x.usta + ' rad', 'red']); });
  if (i.rasm && r.admin) b.push(['rasm', '📸 Rasmlar · ' + i.rasm, '']);
  if (i.yopildi && !i.otkaz && !i.tolov && r.usta && i.usta === r.usta) b.push(['tolov', '💵 To\'lovni kiritish', 'red']);
  if (i.tarixN && ochiq && r.usta && i.usta === r.usta) b.push(['utarix', '📞 Mijoz tarixi · ' + i.tarixN, '']);
  if (r.admin && (i.tel || i.mijoz)) b.push(['mkarta', '👤 Mijoz kartochkasi', '']);
  return b.length ? '<div class="acts">' + b.map(x => '<button class="act ' + x[2] + '" data-act="' + x[0] + '" data-h="' + esc(i.h) + '">' + x[1] + '</button>').join('') + '</div>' : '';
}
const ishlarHammasi = () => [].concat(D.barcha || [], D.meniki || [], D.ustaIshlari || []);
const ishTop = h => ishlarHammasi().find(x => x.h === h);
function oyna(sarlavha, ichi) {
  yop();
  const o = document.createElement('div'); o.className = 'ov'; o.id = 'ov';
  o.innerHTML = '<div class="sheet"><div class="hd"><b>' + esc(sarlavha) + '</b><button class="x" id="ovx">✕</button></div>' + ichi + '</div>';
  o.onclick = e => { if (e.target === o) yop(); };
  document.body.appendChild(o); $('ovx').onclick = yop;
  if (tg && tg.BackButton) { tg.BackButton.show(); tg.BackButton.onClick(yop); }
}
function yop() { const o = $('ov'); if (o) o.remove(); if (tg && tg.BackButton) { tg.BackButton.offClick(yop); tg.BackButton.hide(); } }
async function amal(body, btn, matn) {
  if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = matn || 'Saqlanmoqda…'; }
  try {
    const r = await api(body);

      '<span class="pill ' + (t.holat === 'Tasdiqlandi' ? 'done' : t.holat === 'Rad etildi' ? 'otk' : 'wait') + '">' + (t.holat === 'Tasdiqlandi' ? '✅' : t.holat === 'Rad etildi' ? '❌' : '⏳') + ' ' + esc(t.holat) + '</span></div>' +
      '<div class="time">' + esc(t.vaqt) + '</div></div>' +
      '<div class="mrow"><span>' + (t.mijoz ? esc(t.mijoz) : 'Summa') + '</span><b>' + pul(t.summa) + ' · ' + (t.usul === 'karta' ? '💳 karta' : '💵 naqd') + '</b></div>' +
      (t.izoh ? '<div class="line small"><span class="i">📝</span><span>' + esc(t.izoh) + '</span></div>' : '') +
      (t.kim ? '<div class="line muted small"><span class="i">👤</span><span>' + esc(t.kim) + ' · ' + esc(t.tvaqt) + '</span></div>' : '') +
      (tug ? '<div class="acts"><button class="act" data-tq="1" data-id="' + esc(t.id) + '">✅ Tasdiqlash</button><button class="act red" data-tq="0" data-id="' + esc(t.id) + '">❌ Rad etish</button></div>' : '') + '</div>';
    if (D.rol.admin && KT.length) h += '<h2>⏳ Tasdiq kutayotganlar · ' + KT.length + '</h2>' + KT.map(t => tlKarta(t, true)).join('');
    if (!D.rol.admin && D.rol.usta) h += '<button class="btn" id="dp_yangi">🏦 Depozit kiritish</button>' + (KT.length ? '<h2>⏳ Tasdiq kutilmoqda</h2>' + KT.map(t => tlKarta(t, false)).join('') : '');
    if (D.rol.admin) h += '<div class="kpis"><div class="kpi"><b>' + j('oyIsh') + '</b><span>ish (usta varaqlari)</span></div><div class="kpi"><b>' + mln(j('oySumma')) + '</b><span>ishga olingan summa</span></div>' +
      '<div class="kpi"><b>' + mln(j('oyServis')) + '</b><span>servis daromadi 10%</span></div><div class="kpi"><b>' + mln(j('oyDepozit')) + '</b><span>depozit</span></div></div>';
    h += M.slice().sort((a, b) => b.oySumma - a.oySumma).map(x => '<div class="card"><div class="row"><div class="name">' + esc(x.nom) + '</div><div class="time">' + x.oyIsh + ' ta ish</div></div>' +
      '<div class="mrow"><span>Ishga olingan summa</span><b>' + pul(x.oySumma) + '</b></div>' +
      '<div class="mrow"><span>Servis daromadi 10%</span><b>' + pul(x.oyServis) + '</b></div>' +
      '<div class="mrow"><span>Depozit (shu oy)</span><b>' + pul(x.oyDepozit) + '</b></div>' +
      '<div class="mrow" style="border-top:1px solid var(--line);margin-top:4px;padding-top:8px"><span>Umumiy balans</span><b class="' + (x.balans < 0 ? 'neg' : 'pos') + '">' + pul(x.balans) + '</b></div></div>').join('');
    h += '<p class="muted small" style="margin:12px 4px">Balans = barcha depozitlar − barcha servis daromadi (10%), ustaning varag\'idagi hamma qatorlar bo\'yicha. Manfiy bo\'lsa — usta qarzdor.</p>';
    if (TR.length) h += '<h2>So\'nggi to\'lov va depozitlar</h2>' + TR.slice(0, 15).map(t => tlKarta(t, false)).join('');
    $('main').innerHTML = h;
    document.querySelectorAll('[data-tq]').forEach(b => b.onclick = () => {
      const ok = b.dataset.tq === '1', id = b.dataset.id;
      const go = () => amal({ api: 'tasdiq', id, ok }, b, ok ? 'Tasdiqlanmoqda…' : 'Bajarilmoqda…');
      tg && tg.showConfirm ? tg.showConfirm(ok ? 'Tasdiqlansinmi? Usta balansi yangilanadi.' : 'Rad etilsinmi?', y => y && go()) : go();
    });
    if ($('dp_yangi')) $('dp_yangi').onclick = () => {
      TU = '';
      oyna('🏦 Depozit kiritish', '<label class="f">💰 Summa *</label><input class="in" inputmode="numeric" id="dp_s" placeholder="Summa, so\'m">' +
        '<label class="f">To\'lov usuli *</label><div class="chips"><button class="chip" data-tu="naqd">💵 Naqd</button><button class="chip" data-tu="karta">💳 Karta</button></div>' +
        '<label class="f">📝 Izoh</label><input class="in" id="dp_i" placeholder="Kimga topshirildi va h.k.">' +
        '<button class="btn" id="dp_ok">💾 Yuborish</button><p class="muted small" style="margin:8px 2px">Rahbar tasdiqlagach balansga qo\'shiladi.</p>');
      tolovUlash();
      $('dp_s').oninput = () => { $('dp_s').value = fmtSon($('dp_s').value); };
      $('dp_ok').onclick = () => {
        const sm = $('dp_s').value.replace(/\D/g, '');
        if (!(+sm > 0)) return xabar('💰 Summani kiriting.');
        if (!TU) return xabar('To\'lov usulini tanlang.');
        amal({ api: 'depozit', summa: sm, usul: TU, izoh: $('dp_i').value }, $('dp_ok'), 'Yuborilmoqda…');
      };
    };
    $('m_p').onclick = () => { moliyaOy = oySur(oy, -1); chiz(); };
    $('m_n').onclick = () => { if (oy < D.meta.bugun.slice(0, 7)) { moliyaOy = oySur(oy, 1); chiz(); } };
  } catch (e) { $('main').innerHTML = h + '<div class="err">⚠️ ' + esc(e.message) + '</div>'; }
}

/* ---------- Yangi ish formasi ---------- */
function yangiForma() { return { sana: D.meta.bugun, mijoz: '', tel: '', manzil: '', turlar: [], soni: {}, summa: {}, izoh: '', usta: '', shaxs: '', filial: '' }; }
function ekYangi() {
  if (!F) F = yangiForma();
  if (natija) {
    $('main').innerHTML = '<div class="ok">' + natija.map(esc).join('<br>') + '</div><button class="btn" id="yana">➕ Yana yangi ish</button>';
    $('yana').onclick = () => { natija = null; F = yangiForma(); chiz(); };
    return;
  }
  const m = D.meta, band = {}; (D.ustalar || []).forEach(u => band[u.nom] = u.band || u.qarz != null);
  let h = '';
  h += '<label class="f">📅 Sana</label><input class="in" type="date" id="f_sana" value="' + esc(F.sana) + '">';
  h += '<label class="f">👤 Mijoz ismi *</label><input class="in" id="f_mijoz" placeholder="Masalan: Abdulloh aka" value="' + esc(F.mijoz) + '">';
  h += '<label class="f">📞 Telefon</label><input class="in" id="f_tel" type="tel" inputmode="tel" placeholder="90 123 45 67" value="' + esc(F.tel) + '"><div id="f_tarix">' + (F.tarixHtml || '') + '</div>';
  h += '<label class="f">📍 Manzil</label><input class="in" id="f_manzil" placeholder="Mahalla, ko\'cha, mo\'ljal" value="' + esc(F.manzil) + '">';
  h += '<label class="f">🛠 Ish turi * — bir nechtasini tanlash mumkin</label><div class="chips">' +
    m.turlar.map(t => '<button class="chip' + (F.turlar.includes(t) ? ' on' : '') + '" data-tur="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>';
  F.turlar.forEach(t => {
    h += '<div class="tur"><div class="tn">' + esc(t) + '</div><div class="g">' +
      '<div class="step"><button data-m="' + esc(t) + '">−</button><span>' + (F.soni[t] || 1) + '</span><button data-p="' + esc(t) + '">+</button></div>' +
      '<input class="in" inputmode="numeric" placeholder="Summa, so\'m" data-sm="' + esc(t) + '" value="' + esc(F.summa[t] || '') + '"></div></div>';
  });
  h += '<label class="f">👷 Usta (ixtiyoriy)</label><div class="chips">' +
    '<button class="chip' + (!F.usta ? ' on' : '') + '" data-usta="">⏳ Keyin tanlanadi</button>' +
    m.ustalar.map(u => '<button class="chip' + (F.usta === u ? ' on' : '') + '" data-usta="' + esc(u) + '"' + (band[u] ? ' disabled' : '') + '>' + (band[u] ? ((D.ustalar.find(x => x.nom === u) || {}).qarz != null ? '💸 ' : '🔒 ') : '') + esc(u) + '</button>').join('') + '</div>';
  if (!D.rol.xodim) {
    h += '<label class="f">🙋 Ishni bergan</label><select class="in" id="f_shaxs"><option value="">— tanlang —</option>' + m.shaxslar.map(s => '<option' + (F.shaxs === s ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>';
    h += '<label class="f">🏢 Filial</label><select class="in" id="f_filial"><option value="">— tanlang —</option>' + m.filiallar.map(s => '<option' + (F.filial === s ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>';
  } else h += '<p class="muted small" style="margin:12px 4px 0">🙋 Ishni bergan: <b>' + esc(D.rol.xodim) + '</b> · ' + esc(D.rol.filial) + '</p>';
  h += '<label class="f">📝 Izoh</label><textarea class="in" id="f_izoh" placeholder="Nima qilish kerak, qachon borish…">' + esc(F.izoh) + '</textarea>';
  const jami = F.turlar.reduce((s, t) => s + (Number(String(F.summa[t] || '').replace(/\D/g, '')) || 0), 0);
  h += '<button class="btn" id="f_yubor">💾 Saqlash va yuborish' + (jami ? ' · ' + pul(jami) : '') + '</button>';
  $('main').innerHTML = h;

  const oqi = () => ['sana', 'mijoz', 'tel', 'manzil', 'izoh', 'shaxs', 'filial'].forEach(k => { const e = $('f_' + k); if (e) F[k] = e.value; });
  document.querySelectorAll('[data-tur]').forEach(b => b.onclick = () => { oqi(); const t = b.dataset.tur; F.turlar = F.turlar.includes(t) ? F.turlar.filter(x => x !== t) : F.turlar.concat(t); hap('sel'); chiz(); });
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { oqi(); F.soni[b.dataset.p] = (F.soni[b.dataset.p] || 1) + 1; chiz(); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { oqi(); F.soni[b.dataset.m] = Math.max(1, (F.soni[b.dataset.m] || 1) - 1); chiz(); });
  document.querySelectorAll('[data-sm]').forEach(e => e.oninput = () => {
    const raw = e.value.replace(/\D/g, ''); F.summa[e.dataset.sm] = raw ? raw.replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : ''; e.value = F.summa[e.dataset.sm];
    const j = F.turlar.reduce((s, t) => s + (Number(String(F.summa[t] || '').replace(/\D/g, '')) || 0), 0);
    $('f_yubor').textContent = '💾 Saqlash va yuborish' + (j ? ' · ' + pul(j) : ''); });
  document.querySelectorAll('[data-usta]').forEach(b => b.onclick = () => { oqi(); F.usta = b.dataset.usta; hap('sel'); chiz(); });
  let _tt = null;
  $('f_tel').oninput = () => { clearTimeout(_tt); const v = $('f_tel').value; if (v.replace(/\D/g, '').length < 9) { F.tarixHtml = ''; $('f_tarix').innerHTML = ''; return; }
    _tt = setTimeout(async () => { try { const r = await api({ api: 'mijoz', tel: v }); const t = r.ok && r.tarix;
      F.tarixHtml = t ? '<div class="line small" style="color:var(--orange);margin:6px 2px"><span class="i">🔁</span><span><b>Takroriy mijoz</b> — oldin ' + t.n + ' marta. Oxirgisi: ' + esc(t.sana) + (t.usta ? ', ' + esc(t.usta) : '') + (t.turi ? ' (' + esc(t.turi) + ')' : '') + (t.mijoz ? ' — ' + esc(t.mijoz) : '') + '</span></div>' : '';
      const el = $('f_tarix'); if (el) el.innerHTML = F.tarixHtml; } catch (e) {} }, 600); };
  $('f_yubor').onclick = async () => {
    oqi();
    if (!F.mijoz.trim()) return xabar('Mijoz ismini yozing.');
    if (!F.turlar.length) return xabar('Kamida bitta ish turini tanlang.');
    const btn = $('f_yubor'); btn.disabled = true; btn.textContent = 'Saqlanmoqda…';
    try {
      const r = await api({ api: 'yangi', d: { sana: F.sana, mijoz: F.mijoz, tel: F.tel, manzil: F.manzil, izoh: F.izoh, usta: F.usta, shaxs: F.shaxs, filial: F.filial,
        ishlar: F.turlar.map(t => ({ turi: t, soni: F.soni[t] || 1, summa: String(F.summa[t] || '').replace(/\D/g, '') })) } });
      if (!r.ok) throw new Error(r.xato || 'Saqlanmadi');
      hap('success'); natija = r.natija; F = null; yukla(true);
    } catch (e) { btn.disabled = false; btn.textContent = '💾 Saqlash va yuborish'; hap('error'); xabar('⚠️ ' + e.message); }
  };
}

/* ---------- Ishni tugatdim ---------- */
function tugat(h, btn) {
  const R = [];   // tayyor JPEG (dataURL)
  oyna('✅ Ishni tugatish', '<p class="muted small" style="margin:0 2px 10px">📸 Bajarilgan ish rasmini yuklang (1–3 ta). <b>Rasmsiz ish yopilmaydi.</b></p>' +
    '<div id="rp" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px"></div>' +
    '<label class="btn ghost" id="rl" style="display:block;text-align:center;cursor:pointer">📷 Rasm qo\'shish<input type="file" accept="image/*" multiple id="rf" style="display:none"></label>' +
    (ishTop(h) ? tolovMaydon(ishTop(h)) : '') +
    '<button class="btn" id="r_ok" disabled>✅ Ishni yopish</button>');
  tolovUlash();
  const chizR = () => {
    $('rp').innerHTML = R.map((d, k) => '<div style="position:relative"><img src="' + d + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block">' +
      '<button data-rx="' + k + '" style="position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff">✕</button></div>').join('');
    document.querySelectorAll('[data-rx]').forEach(b => b.onclick = () => { R.splice(+b.dataset.rx, 1); chizR(); });
    $('r_ok').disabled = !R.length; $('rl').style.display = R.length >= 3 ? 'none' : 'block';
  };
  const kichrayt = f => new Promise((ok, no) => {
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL('image/jpeg', 0.75)); };
    im.onerror = () => { URL.revokeObjectURL(u); no(new Error('Rasmni o\'qib bo\'lmadi')); };
    im.src = u;
  });
  $('rf').onchange = async e => {
    for (const f of [...e.target.files].slice(0, 3 - R.length)) { try { R.push(await kichrayt(f)); } catch (x) { xabar('⚠️ ' + x.message); } }
    e.target.value = ''; hap('sel'); chizR();
  };
  $('r_ok').onclick = async () => {
    if (!R.length) return xabar('📸 Kamida 1 ta rasm yuklang.');
    const tl = ishTop(h) ? tolovOl() : {}; if (!tl) return;
    const b = $('r_ok'); b.disabled = true; b.textContent = 'Yuklanmoqda…';
    try {
      const r = await api(Object.assign({ api: 'tugatdim', h, rasmlar: R }, tl));
      if (!r.ok) throw new Error(r.xato);
      hap('success'); yop(); if (btn) { btn.disabled = true; btn.textContent = '✅ Yopildi'; }
      xabar(r.oldin ? '✅ Bu ish allaqachon yopilgan.' : '✅ Ish yopildi — ' + r.vaqt + '\n📸 ' + r.rasm + ' ta rasm saqlandi.' + (r.tolov ? '\n💵 To\'lov rahbar tasdig\'iga yuborildi.' : r.tolovXato ? '\n⚠️ To\'lov: ' + r.tolovXato : '')); MOL = {}; await yukla(true);
    } catch (x) { b.disabled = false; b.textContent = '✅ Ishni yopish'; hap('error'); xabar('⚠️ ' + x.message); }
  };
}

$('ref').onclick = () => { hap('sel'); MOL = {}; ES = null; MJ = {}; yukla(); };
/* Ilovaga qaytilganda va so'rov kutilayotganda ma'lumot o'zi yangilansin */
let _oxirgi = Date.now();
const jimYangila = () => { if (!D || !D.ruxsat || $('ov') || ekran === 'yangi' || ekran === 'eslatma') return; if (Date.now() - _oxirgi < 15000) return; _oxirgi = Date.now(); MOL = {}; yukla(true); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) jimYangila(); });
try { tg && tg.onEvent && tg.onEvent('activated', jimYangila); } catch (e) {}
setInterval(() => { if (!document.hidden && D && (D.boshIshlar || []).some(i => i.sorov)) jimYangila(); }, 30000);
if (!tg || !tg.initData) {
  $('sub').textContent = '';
  $('main').innerHTML = bosh('📱', 'Bu sahifa faqat Telegram ichida ishlaydi.<br><br>@halowatt_servis_bot ni oching va «📱 Ochish» tugmasini bosing.');
} else { $('ref').hidden = false; yukla(); }
</script>
